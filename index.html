<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8f3e8" />
<title>나의 도장 수첩</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#463b34;background:#f8f3e8;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79a58a;outline-offset:2px}.app{max-width:570px;margin:auto;min-height:100dvh;padding:24px 18px 104px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 24px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#a98c6c;font-weight:800}.top h1{font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:28px;margin:5px 0 3px}.muted{color:#938575;font-size:13px;line-height:1.55}.paper{background:#fffdfa;border:1px solid #eadfcd;box-shadow:0 6px 26px #6c48210a;border-radius:22px;padding:20px}.summary{background:linear-gradient(120deg,#e7ebdb,#f5eadb);border:1px solid #e6e1d2;border-radius:20px;padding:22px;margin-bottom:22px}.summary .big{font-size:29px;font-weight:800;margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:13px}.small{font-size:12px}.label{display:block;font-weight:750;font-size:13px;margin:0 0 9px}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:750;background:#edf3e8;color:#607e57}.pill.gold{background:#fff0d8;color:#a8783f}.pill.gray{background:#f0ece5;color:#918374}.ghost{background:transparent;border:1px solid #dfd2c0;color:#765b43;border-radius:11px;padding:10px 13px}.primary{border:0;border-radius:13px;background:#809f80;color:white;font-weight:800;padding:14px 16px;box-shadow:0 3px 8px #637f6326}.primary:hover{background:#6d926f}.secondary{border:1px solid #ded2bf;border-radius:13px;background:white;color:#6c5844;padding:12px 14px;font-weight:700}.danger{background:#fff0ec;color:#aa6054;border:1px solid #efc6bd;border-radius:12px;padding:11px 13px}.full{width:100%}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.sectionHead h2{font-size:17px;margin:0}.goalCard{width:100%;display:block;text-align:left;border:1px solid #ecdfc9;background:#fffefa;border-radius:17px;padding:18px;box-shadow:0 2px 10px #60402309}.goalCard:hover{border-color:#b6c8ae}.goalCard h3{font-size:16px;margin:0 0 8px}.progress{height:9px;border-radius:20px;overflow:hidden;background:#eae6dd;margin:13px 0 7px}.progress span{display:block;height:100%;background:#9aae8b;transition:width .2s}.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px}.chip{border:1px solid #e4d7c4;background:#fffdfa;border-radius:999px;padding:8px 13px;color:#8c7b66;white-space:nowrap}.chip.active{background:#6d876d;color:white;border-color:#6d876d}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fffdf8eb;backdrop-filter:blur(14px);border-top:1px solid #eadfcf;padding:9px 10px max(9px,env(safe-area-inset-bottom))}.bottomInner{display:grid;grid-template-columns:repeat(3,1fr);max-width:570px;width:100%;gap:8px}.navItem{border:0;background:transparent;color:#948674;border-radius:12px;padding:8px 4px;font-size:12px;display:grid;gap:4px;justify-items:center}.navItem.on{color:#5c7c5b;background:#edf2e6;font-weight:800}.navItem span:first-child{font-size:22px}.back{border:0;background:transparent;color:#856c53;padding:6px 0 9px;display:flex;align-items:center;gap:6px}.headInline{display:flex;align-items:center;gap:10px}.headInline h1{font-size:23px;margin:0}.form{display:grid;gap:19px}.field{width:100%;background:#fffefa;border:1px solid #e0d4c4;border-radius:12px;padding:13px;color:#493b2e;min-width:0}.radioGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:1px solid #e5d9c9;border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:white}.choice:has(input:checked){border-color:#83a484;background:#f1f6ed}.choice input{accent-color:#7a9a78}.choice b{font-size:13px}.choice small{font-size:11px;color:#91836f;line-height:1.5}.periods{display:flex;gap:8px;flex-wrap:wrap}.periods label{cursor:pointer}.periods input{position:absolute;opacity:0}.periods span{border:1px solid #e4d7c4;border-radius:12px;display:block;padding:10px 15px;background:white}.periods input:checked+span{background:#e5eee0;border-color:#8fac89;color:#52774d;font-weight:800}.stampOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stampOption{border:1px solid #e9ddcd;border-radius:13px;background:#fff;min-height:75px;display:grid;justify-items:center;align-content:center;gap:3px}.stampOption.selected{border:2px solid #aa9778;background:#fcf0dd}.stampOption .em{font-size:30px;line-height:1.2}.stampOption img{height:34px;width:34px;object-fit:contain}.stampOption small{font-size:10px;color:#927d68}.stampsGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.stampCell{aspect-ratio:1;border:1px dashed #decfb9;border-radius:13px;background:#fffefa;display:grid;place-items:center;position:relative;padding:8px;min-width:0}.stampCell.done{border-style:solid;border-color:#e0c69e;background:#fbecda}.stampCell.available{cursor:pointer}.stampCell:disabled{opacity:.53;cursor:not-allowed}.stampCell .index{position:absolute;left:7px;top:5px;font-size:10px;color:#ae987f}.stampCell .mark{font-size:clamp(20px,7vw,33px);line-height:1;max-width:80%;max-height:80%;object-fit:contain}.stampCell .mark.img{width:85%;height:85%}.dateGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.dateCell{aspect-ratio:1;position:relative;background:white;border:1px dashed #e0d1ba;border-radius:12px;display:grid;place-items:center}.dateCell.done{background:#f9ebd9;border-style:solid}.dateCell.future{opacity:.5}.dateCell small{position:absolute;top:3px;left:6px;font-size:9px;color:#9d8a70}.dateCell .mark{font-size:25px;max-width:70%;max-height:70%;object-fit:contain}.dateCell .mark.img{width:70%;height:70%}.metric{font-size:28px;color:#80654b;font-weight:850}.empty{text-align:center;border:1px dashed #dfd2bf;border-radius:18px;padding:34px 20px;color:#90816f}.empty .emoji{font-size:40px;display:block;margin-bottom:10px}.hint{background:#f7f1e6;border-radius:13px;padding:12px 14px;color:#806e59;font-size:12px;line-height:1.65}.sep{border:0;border-top:1px solid #ede2d4;margin:18px 0}.thumb{width:64px;height:64px;border:1px solid #eadcc9;border-radius:13px;background:#fff8ed;display:grid;place-items:center;flex-shrink:0}.thumb img{width:85%;height:85%;object-fit:contain}.thumb .em{font-size:31px}.libraryRow{display:flex;align-items:center;gap:12px;border:1px solid #e8ddcc;border-radius:14px;padding:12px;background:white}.libraryRow .details{flex:1;min-width:0}.libraryRow h3{margin:0 0 3px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.libraryRow .meta{font-size:11px;color:#998b78}.alert{padding:12px 14px;border-radius:12px;background:#f5eada;border:1px solid #e7d1ae;color:#7e653e;font-size:13px;line-height:1.5}.toast{position:fixed;z-index:90;bottom:90px;left:50%;transform:translateX(-50%);background:#493c31;color:white;padding:11px 17px;border-radius:20px;font-size:13px;box-shadow:0 5px 16px #0002;max-width:90%;text-align:center}.hidden{display:none!important}.customPreview{height:84px;width:84px;object-fit:contain;border:1px dashed #e4d5c2;background:#fff8ea;border-radius:13px;padding:6px}.imgInfo{overflow-wrap:anywhere}.footActions{display:flex;gap:8px;flex-wrap:wrap}.footActions button{flex:1}.dangerText{color:#a76353}.smallTop{margin:0 0 6px}.infoColumns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.infoColumns>div{background:#f7f2e9;padding:14px;border-radius:13px}.infoColumns strong{display:block;margin-top:5px;font-size:18px}.modalShade{position:fixed;inset:0;z-index:40;background:#20170fa8;display:grid;place-items:center;padding:15px}.modal{max-width:480px;width:100%;max-height:90dvh;overflow:auto;background:#fffdfa;border-radius:21px;padding:22px}.modal h2{margin:0 0 12px}.checkRow{display:flex;align-items:center;gap:9px;font-size:13px}.checkRow input{accent-color:#819e7c}.buttonRow{display:flex;gap:9px}.buttonRow>*{flex:1}.dateNote{margin:10px 0 0;font-size:12px;color:#94836c}.archiveBadge{font-size:12px;color:#997753}.footerNote{font-size:11px;color:#9c8b73;text-align:center;margin:23px 0}.imageToolbar{display:flex;gap:8px}.imageToolbar button{flex:1}.overline{color:#9a846a;font-size:11px;font-weight:800;letter-spacing:.12em}.help{font-size:12px;color:#9b8974;line-height:1.6}.line{height:1px;background:#f0e5d7;margin:15px 0}@media(min-width:570px){.app{padding:35px 25px 110px}.top h1{font-size:33px}.stampCell .mark{font-size:33px}}@media(prefers-reduced-motion:no-preference){.stampCell.justStamped .mark{animation:stampIn .25s cubic-bezier(.16,1.5,.5,1)}@keyframes stampIn{from{transform:scale(1.7) rotate(-13deg);opacity:.4}to{transform:scale(1);opacity:1}}}
</style>
</head>
<body>
<div id="app" class="app"><p>도장 수첩을 열고 있어요…</p></div>
<div id="nav" class="bottom hidden"></div>
<div id="toast" role="status" aria-live="polite" class="toast hidden"></div>
<div id="modalRoot"></div>
<script>
(()=>{'use strict';
const DB_NAME='stamp-book-v1',DB_VERSION=1, GOALS='goals', IMAGES='images';
const EMOJI=[['🐾','발바닥'],['🌸','꽃'],['⭐','별'],['❤️','하트'],['🍀','네잎클로버'],['🐱','고양이']];
const app=document.getElementById('app'),nav=document.getElementById('nav'),toastEl=document.getElementById('toast'),modalRoot=document.getElementById('modalRoot');
let db,goals=[],images=[],page='home',filter='active',goalId=null,flashTimer,lastStamped=null,uploading=false;
const uid=()=> typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const plusDays=(ymd,n)=>{const [y,m,d]=ymd.split('-').map(Number),date=new Date(y,m-1,d+n);return localDate(date)};
const fmtDate=s=>s?`${Number(s.slice(5,7))}월 ${Number(s.slice(8,10))}일`:'';
const fmtBytes=n=>n<1024?`${n} B`:n<1024*1024?`${(n/1024).toFixed(1)} KB`:`${(n/1024/1024).toFixed(2)} MB`;
const byId=id=>goals.find(g=>g.id===id), byImage=id=>images.find(i=>i.id===id);
const imageURL=new Map();function urlFor(img){if(!img)return '';if(!imageURL.has(img.id))imageURL.set(img.id,URL.createObjectURL(img.blob));return imageURL.get(img.id)}
const mark=(stamp,cls='mark')=>{if(stamp?.type==='image'){let img=byImage(stamp.value);return img?`<img class="${cls} img" src="${urlFor(img)}" alt="도장">`:'<span class="mark">?</span>'}return `<span class="${cls}">${escapeHTML(stamp?.value||'🐾')}</span>`};
const count=g=>g.entries.length;
const finished=g=>g.type==='count'?count(g)>=g.target:count(g)>=g.target||plusDays(g.start,g.target-1)<localDate();
const statusText=g=>g.type==='count'?count(g)>=g.target?'완료':'진행 중':count(g)>=g.target?'전체 달성':plusDays(g.start,g.target-1)<localDate()?'기간 종료':'진행 중';
const progress=g=>Math.round(count(g)/g.target*100);
function toast(s){toastEl.textContent=s;toastEl.classList.remove('hidden');clearTimeout(flashTimer);flashTimer=setTimeout(()=>toastEl.classList.add('hidden'),2700)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(GOALS))d.createObjectStore(GOALS,{keyPath:'id'});if(!d.objectStoreNames.contains(IMAGES))d.createObjectStore(IMAGES,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getAll(store){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readonly'),r=t.objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
function del(store,id){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)})}
async function refresh(){[goals,images]=await Promise.all([getAll(GOALS),getAll(IMAGES)]);goals.sort((a,b)=>b.created.localeCompare(a.created));}
function setPage(p,id=null){page=p;if(id)goalId=id;window.scrollTo(0,0);render()}
function heading(title,subtitle='',back='home'){return `<header class="top"><div><button class="back" data-nav="${back}">‹ 돌아가기</button><h1>${escapeHTML(title)}</h1>${subtitle?`<div class="muted">${subtitle}</div>`:''}</div></header>`}
function navRender(){nav.classList.toggle('hidden',page==='create'||page==='detail'||page==='settings');nav.innerHTML=`<div class="bottomInner"><button class="navItem ${page==='home'?'on':''}" data-nav="home"><span>⌂</span>내 달성표</button><button class="navItem ${page==='archive'?'on':''}" data-nav="archive"><span>▤</span>보관함</button><button class="navItem ${page==='library'?'on':''}" data-nav="library"><span>✿</span>내 도장</button></div>`}
function card(g){let n=count(g);return `<button class="goalCard" data-open-goal="${escapeHTML(g.id)}"><div class="row"><h3>${escapeHTML(g.name)}</h3><span class="pill ${finished(g)?'gold':''}">${statusText(g)}</span></div><div class="row"><span class="muted">${g.type==='count'?'누적형':'날짜형'} · ${g.target}${g.type==='count'?'회':'일'}</span><span class="small" style="font-size:23px">${mark(g.stamp,'')}</span></div><div class="progress"><span style="width:${progress(g)}%"></span></div><div class="row"><span class="muted">${n} / ${g.target} ${g.type==='count'?'회':'일'}</span><span class="muted">${progress(g)}% ↗</span></div></button>`}
function home(){let active=goals.filter(g=>!finished(g)),complete=goals.filter(finished);let list=filter==='all'?goals:filter==='done'?complete:active;return `<header class="top"><div><div class="eyebrow">MY LITTLE STAMP BOOK</div><h1>나의 도장 수첩 ✿</h1><div class="muted">하나씩 모으는 작은 성취</div></div><button class="ghost" data-nav="settings" aria-label="설정과 백업">⚙</button></header><section class="summary"><div class="small" style="color:#71826c">현재 진행 중인 목표</div><div class="big">${active.length}개 <span style="font-weight:400;font-size:15px;color:#879479">· 완료 ${complete.length}개</span></div><div class="muted">오늘도 작은 도장 하나부터!</div></section><div class="row" style="margin-bottom:14px"><h2 style="font-size:18px;margin:0">내 달성표</h2><button class="primary" data-nav="create">＋ 새로 만들기</button></div><div class="filters">${[['active','진행 중'],['done','완료'],['all','전체']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div><div class="stack">${list.length?list.map(card).join(''):`<div class="empty"><span class="emoji">${filter==='done'?'🏅':'📒'}</span>${filter==='done'?'완료한 달성표가 아직 없어.':'여기에 나만의 달성표를 모아보자!'}${filter==='active'?'<p><button class="primary" data-nav="create">첫 달성표 만들기</button></p>':''}</div>`}</div><div class="footerNote">모든 기록은 이 기기의 브라우저에 저장돼요.</div>`}
function archive(){let done=goals.filter(finished);return `${heading('완료한 수첩','완성한 도장판을 하나씩 모아두는 공간')}<div class="stack">${done.length?done.map(g=>`<div>${card(g)}<div class="archiveBadge" style="text-align:right;padding:5px 3px">${g.type==='date'?'기간: '+fmtDate(g.start)+' ~ '+fmtDate(plusDays(g.start,g.target-1)):'시작: '+fmtDate(g.start)} ${count(g)===g.target?'· 전체 달성':''}</div></div>`).join(''):'<div class="empty"><span class="emoji">📚</span>아직 보관된 달성표가 없어.</div>'}</div>`}
function detail(){let g=byId(goalId);if(!g){page='home';return home()}let n=count(g),isDate=g.type==='date',today=localDate();return `${heading(g.name,`${isDate?'날짜형':'누적형'} · ${g.target}${isDate?'일':'회'} 달성표`)}<section class="paper"><div class="row"><span class="pill ${finished(g)?'gold':''}">${statusText(g)}</span><button class="ghost" data-edit="${g.id}" style="font-size:12px">꾸미기 · 수정 ⚙</button></div><div style="text-align:center;margin:18px 0 16px"><div class="overline">STAMP COLLECTION</div><div class="metric">${n} <span style="font-size:18px;color:#b7a48c">/ ${g.target}</span></div><div class="progress"><span style="width:${progress(g)}%"></span></div><div class="muted" style="margin-top:5px">${progress(g)}% 달성</div></div>${isDate?`<div class="dateGrid">${Array.from({length:g.target},(_,i)=>{let day=plusDays(g.start,i),entry=g.entries.find(e=>e.day===day),future=day>today;return `<button class="dateCell ${entry?'done':''} ${future?'future':''}" data-date-stamp="${day}" ${future?'disabled title="미래 날짜에는 도장을 찍을 수 없어요"':''}><small>${fmtDate(day)}</small>${entry?mark(g.stamp):'<span style="color:#c5b7a5;font-size:20px">＋</span>'}</button>`}).join('')}</div><p class="dateNote">${fmtDate(g.start)} ~ ${fmtDate(plusDays(g.start,g.target-1))} · 지난 날짜에도 도장을 찍거나 취소할 수 있어요.</p>`:`<div class="stampsGrid">${Array.from({length:g.target},(_,i)=>`<button class="stampCell ${i<n?'done':''} ${i===n||i===n-1?'available':''} ${lastStamped===g.id&&i===n-1?'justStamped':''}" data-count-stamp="${i}" ${i>n?'disabled title="앞 순서의 도장을 먼저 찍어 주세요"':''}><span class="index">${i+1}</span>${i<n?mark(g.stamp):'<span style="color:#c5b7a5;font-size:21px">＋</span>'}</button>`).join('')}</div><p class="dateNote">기간 제한 없이 ${g.target}회 모으기 · ${g.dailyLimit?'하루 최대 1개':'하루 여러 개 가능'}</p>`}<div class="line"></div>${isDate?'<div class="hint">도장판에서 원하는 날짜를 눌러 기록해. 도장을 다시 누르면 그날의 기록을 지울 수 있어.</div>':`<button class="primary full" data-add-count="${g.id}" ${n>=g.target?'disabled':g.dailyLimit&&g.entries.some(e=>e.day===today)?'disabled':''}>${n>=g.target?'🎉 모두 모았어!':g.dailyLimit&&g.entries.some(e=>e.day===today)?'오늘의 도장을 이미 찍었어':'✿ 도장 하나 찍기'}</button><button class="secondary full" style="margin-top:8px" data-undo-count="${g.id}" ${!n?'disabled':''}>마지막 도장 취소</button>`}${finished(g)?`<div class="alert" style="margin-top:14px">🎉 ${n===g.target?'모든 도장을 모았어!':'설정한 기간이 끝났어.'} 보관함에서 다시 열어볼 수 있어.</div>`:''}<hr class="sep"><details><summary style="cursor:pointer;font-size:13px;color:#856f56">달성 기록 보기 (${n}개)</summary><div style="max-height:250px;overflow:auto;margin-top:9px">${[...g.entries].reverse().map((e,i)=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eee1d4"><span class="small">${n-i}번째 도장</span><span class="muted">${escapeHTML(e.day)} ${e.at?new Date(e.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):''}</span></div>`).join('')||'<p class="muted">아직 기록이 없어.</p>'}</div></details><hr class="sep"><button class="danger full" data-delete-goal="${g.id}">달성표 삭제</button></section>`}
function options(stamp){return `<div class="stampOptions">${EMOJI.map(([em,n])=>`<button type="button" class="stampOption ${stamp?.type==='emoji'&&stamp.value===em?'selected':''}" data-select-stamp="emoji:${encodeURIComponent(em)}"><span class="em">${em}</span><small>${n}</small></button>`).join('')}${images.map(img=>`<button type="button" class="stampOption ${stamp?.type==='image'&&stamp.value===img.id?'selected':''}" data-select-stamp="image:${img.id}"><img src="${urlFor(img)}" alt=""><small>${escapeHTML(img.name)}</small></button>`).join('')}</div>`}
let draft=null;
function create(){if(!draft)draft={name:'',target:30,custom:false,type:'count',start:localDate(),dailyLimit:true,stamp:{type:'emoji',value:'🐾'}};return `${heading('새 달성표 만들기','나만의 목표를 적어 봐')}<form id="goalForm" class="paper form"><div><label class="label" for="goalName">목표 이름</label><input id="goalName" class="field" name="name" value="${escapeHTML(draft.name)}" placeholder="예: 매일 30분 산책하기" maxlength="60" required></div><div><label class="label">달성 방식</label><div class="radioGrid"><label class="choice"><input type="radio" name="type" value="date" ${draft.type==='date'?'checked':''}><b>📅 날짜형</b><small>시작일부터 정해진 날짜마다 도장을 하나씩</small></label><label class="choice"><input type="radio" name="type" value="count" ${draft.type==='count'?'checked':''}><b>🐾 누적형</b><small>기간에 상관없이 도장을 모으기</small></label></div></div><div><label class="label">목표 ${draft.type==='date'?'일수':'횟수'}</label><div class="periods">${[7,15,30,100].map(n=>`<label><input type="radio" name="period" value="${n}" ${!draft.custom&&draft.target===n?'checked':''}><span>${n}${draft.type==='date'?'일':'회'}</span></label>`).join('')}<label><input type="radio" name="period" value="custom" ${draft.custom?'checked':''}><span>직접 입력</span></label></div><div id="customBox" ${!draft.custom?'class="hidden"':''} style="margin-top:10px"><input class="field" type="number" name="customTarget" min="1" max="365" value="${draft.custom?draft.target:30}" placeholder="1~365" aria-label="직접 입력한 목표 수"></div></div><div><label class="label" for="start">시작일</label><input id="start" class="field" type="date" name="start" value="${draft.start}" required></div><div id="limitBox" ${draft.type==='date'?'class="hidden"':''}><label class="checkRow"><input type="checkbox" name="dailyLimit" ${draft.dailyLimit?'checked':''}> 하루에 도장 최대 1개</label><div class="help">체크를 해제하면 같은 날에도 여러 번 찍을 수 있어.</div></div><div><label class="label">도장 디자인</label><div id="draftStampOptions">${options(draft.stamp)}</div><div style="margin-top:12px"><button type="button" class="secondary full" data-upload-open>＋ 내 이미지 업로드</button></div></div><button class="primary full" type="submit">달성표 만들기</button></form>`}
function library(){return `${heading('내 도장 보관함','이미지를 저장하고 다른 달성표에 재사용해')}<section class="paper"><div class="row"><div><div class="overline">MY STAMPS</div><h2 style="margin:5px 0">${images.length}개 저장됨</h2><div class="muted">총 ${fmtBytes(images.reduce((s,i)=>s+i.blob.size,0))}</div></div><button class="primary" data-upload-open>＋ 업로드</button></div><hr class="sep"><div class="stack">${images.length?images.map(img=>{let users=goals.filter(g=>g.stamp?.type==='image'&&g.stamp.value===img.id);return `<div class="libraryRow"><div class="thumb"><img src="${urlFor(img)}" alt="${escapeHTML(img.name)}"></div><div class="details"><h3>${escapeHTML(img.name)}</h3><div class="meta">${fmtBytes(img.blob.size)} · ${users.length?'달성표 '+users.length+'개에서 사용 중':'미사용'}</div></div><button class="danger" data-image-delete="${img.id}">삭제</button></div>`}).join(''):'<div class="empty"><span class="emoji">🎨</span>이미지를 업로드하면 이곳에 보관돼.</div>'}</div></section><div class="hint" style="margin-top:14px">이미지는 최대 256픽셀로 줄여 저장돼. 이미지를 삭제해도 달성 기록 자체는 지워지지 않아.</div>`}
function settings(){return `${heading('설정과 백업','기록을 안전하게 보관해')}<section class="paper stack"><div><h2>전체 데이터 백업</h2><p class="muted">달성표, 도장 기록, 이미지까지 모두 JSON 파일 하나로 저장해.</p><button class="primary full" data-export>⬇ 백업 파일 내보내기</button></div><hr class="sep"><div><h2>백업 가져오기</h2><p class="muted">기존 데이터를 백업 파일의 내용으로 교체해. 가져오기 전에 현재 기록도 백업하는 걸 권장해.</p><button class="secondary full" data-import-open>⬆ 백업 파일 가져오기</button></div><hr class="sep"><div><h2>저장 방식</h2><p class="muted">별도의 서버나 회원가입 없이 현재 브라우저의 IndexedDB에 저장돼. 같은 주소라도 다른 기기나 브라우저에서는 기록이 자동으로 공유되지 않아.</p></div></section>`}
function render(){if(!db)return;navRender();app.innerHTML=page==='home'?home():page==='detail'?detail():page==='create'?create():page==='archive'?archive():page==='library'?library():settings();lastStamped=null;}
function dialog(inner){modalRoot.innerHTML=`<div class="modalShade" role="dialog" aria-modal="true"><div class="modal">${inner}</div></div>`}
function closeDialog(){modalRoot.innerHTML=''}
function ask(title,message,confirmLabel,fn){dialog(`<h2>${escapeHTML(title)}</h2><p class="muted">${escapeHTML(message)}</p><div class="buttonRow" style="margin-top:22px"><button class="secondary" id="cancelModal">취소</button><button class="danger" id="confirmModal">${escapeHTML(confirmLabel)}</button></div>`);document.getElementById('cancelModal').onclick=closeDialog;document.getElementById('confirmModal').onclick=async()=>{closeDialog();try{await fn()}catch(e){console.error(e);toast('처리하지 못했어. 다시 시도해 줘.')}}}
function restoreDraft(){const f=document.getElementById('goalForm');if(!f||!draft)return;draft.name=f.elements.name.value;draft.type=f.elements.type.value;draft.start=f.elements.start.value;draft.dailyLimit=f.elements.dailyLimit.checked;draft.custom=f.elements.period.value==='custom';draft.target=Number(draft.custom?f.elements.customTarget.value:f.elements.period.value)||30;}
function uploadDialog(){dialog(`<h2>새 도장 이미지</h2><p class="muted">PNG, JPG, WebP 등을 업로드하면 비율을 유지한 채 최대 256픽셀로 줄여 저장해.</p><label class="label" for="imageFile">이미지 선택</label><input class="field" type="file" accept="image/*" id="imageFile"><div id="imageFileInfo" class="help" style="margin:10px 0">아직 선택한 이미지가 없어.</div><label class="label" for="imageName">도장 이름</label><input class="field" id="imageName" maxlength="60" placeholder="예: 나의 고양이 도장"><div class="buttonRow" style="margin-top:18px"><button class="secondary" id="cancelModal">취소</button><button class="primary" id="saveUpload">저장</button></div>`);document.getElementById('cancelModal').onclick=closeDialog;document.getElementById('imageFile').onchange=e=>{const f=e.target.files[0];if(f){document.getElementById('imageFileInfo').textContent=`${f.name} (${fmtBytes(f.size)})`;if(!document.getElementById('imageName').value)document.getElementById('imageName').value=f.name.replace(/\.[^.]+$/,'')}};document.getElementById('saveUpload').onclick=async()=>{if(uploading)return;let f=document.getElementById('imageFile').files[0],name=document.getElementById('imageName').value.trim();if(!f||!f.type.startsWith('image/')){toast('이미지 파일을 골라 줘.');return}if(f.size>20*1024*1024){toast('20MB 이하 이미지를 선택해 줘.');return}uploading=true;let btn=document.getElementById('saveUpload');btn.disabled=true;btn.textContent='이미지 처리 중…';try{let blob=await shrink(f),img={id:uid(),name:name||'내 도장',blob,created:new Date().toISOString()};await put(IMAGES,img);await refresh();if(page==='create'&&draft){draft.stamp={type:'image',value:img.id}}closeDialog();render();toast('내 도장 보관함에 저장했어!')}catch(e){console.error(e);toast('이미지를 변환할 수 없어. 다른 파일로 시도해 줘.')}finally{uploading=false}}}
async function shrink(file){let url=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});let scale=Math.min(1,256/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,w,h);let result=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.88));if(!result)result=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!result)throw new Error('canvas blob failed');return result}finally{URL.revokeObjectURL(url)}}
async function addCount(g){if(count(g)>=g.target)return;const day=localDate();if(g.dailyLimit&&g.entries.some(e=>e.day===day)){toast('오늘은 이미 도장을 찍었어.');return}g.entries.push({id:uid(),day,at:new Date().toISOString()});await put(GOALS,g);lastStamped=g.id;await refresh();render();if(count(g)>=g.target)toast('🎉 목표 달성! 모든 도장을 모았어!');else toast('도장 하나 꾹! 🐾')}
async function undoCount(g){if(!g.entries.length)return;g.entries.pop();await put(GOALS,g);await refresh();render();toast('마지막 도장을 취소했어.')}
async function toggleDate(g,day){if(day>localDate())return;let idx=g.entries.findIndex(e=>e.day===day);if(idx>=0){g.entries.splice(idx,1)}else{g.entries.push({id:uid(),day,at:new Date().toISOString()})}await put(GOALS,g);lastStamped=g.id;await refresh();render();toast(idx>=0?'이 날짜의 도장을 지웠어.':'도장 하나 꾹!')}
function editDialog(g){dialog(`<h2>달성표 수정</h2><p class="help">기존 기록을 보호하기 위해 목표 방식과 칸 수는 수정할 수 없어.</p><label class="label" for="editName">목표 이름</label><input class="field" id="editName" maxlength="60" value="${escapeHTML(g.name)}"><div style="margin-top:18px"><label class="label">도장 디자인</label><div id="editStampOptions">${options(g.stamp)}</div></div><div class="buttonRow" style="margin-top:20px"><button class="secondary" id="cancelModal">취소</button><button class="primary" id="saveEdit">수정 저장</button></div>`);let chosen={...g.stamp};document.getElementById('cancelModal').onclick=closeDialog;let opts=document.getElementById('editStampOptions');opts.onclick=e=>{let b=e.target.closest('[data-select-stamp]');if(!b)return;let [type,value]=b.dataset.selectStamp.split(':');chosen={type,value:type==='emoji'?decodeURIComponent(value):value};opts.innerHTML=options(chosen)};document.getElementById('saveEdit').onclick=async()=>{let n=document.getElementById('editName').value.trim();if(!n){toast('목표 이름을 입력해 줘.');return}g.name=n;g.stamp=chosen;await put(GOALS,g);await refresh();closeDialog();render();toast('달성표를 수정했어.')}}
function deleteImageDialog(id){let img=byImage(id);if(!img)return;let users=goals.filter(g=>g.stamp?.type==='image'&&g.stamp.value===id);if(!users.length){ask('도장 이미지 삭제',`'${img.name}' 이미지를 보관함에서 삭제할까?`, '삭제하기',async()=>{await del(IMAGES,id);URL.revokeObjectURL(imageURL.get(id));imageURL.delete(id);await refresh();render();toast('이미지를 삭제했어.')});return}let alternatives=EMOJI.map(([e,n])=>`<option value="emoji:${encodeURIComponent(e)}">${e} ${n}</option>`).join('')+images.filter(i=>i.id!==id).map(i=>`<option value="image:${i.id}">${escapeHTML(i.name)}</option>`).join('');dialog(`<h2>사용 중인 도장이야</h2><p class="muted">이 이미지는 ${users.length}개의 달성표에서 사용 중이야. 삭제하려면 다른 도장으로 교체해야 해.</p><div class="hint">${users.map(g=>escapeHTML(g.name)).join(' · ')}</div><label class="label" style="margin-top:18px" for="replacement">교체할 도장</label><select class="field" id="replacement">${alternatives}</select><div class="buttonRow" style="margin-top:22px"><button class="secondary" id="cancelModal">취소</button><button class="danger" id="replaceAndDelete">교체 후 삭제</button></div>`);document.getElementById('cancelModal').onclick=closeDialog;document.getElementById('replaceAndDelete').onclick=async()=>{let [type,v]=document.getElementById('replacement').value.split(':');let stamp={type,value:type==='emoji'?decodeURIComponent(v):v};try{await new Promise((resolve,reject)=>{const tx=db.transaction([GOALS,IMAGES],'readwrite');for(let g of users)tx.objectStore(GOALS).put({...g,stamp});tx.objectStore(IMAGES).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});URL.revokeObjectURL(imageURL.get(id));imageURL.delete(id);await refresh();closeDialog();render();toast('도장을 교체하고 이미지를 삭제했어.')}catch(e){console.error(e);toast('삭제하지 못했어.')}}}
async function blobToBase64(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
async function exportBackup(){try{let obj={app:'stamp-book',version:1,exportedAt:new Date().toISOString(),goals,images:await Promise.all(images.map(async img=>({id:img.id,name:img.name,created:img.created,data:await blobToBase64(img.blob)})))};let blob=new Blob([JSON.stringify(obj)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`stamp-book-backup-${localDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('백업 파일을 저장했어.')}catch(e){console.error(e);toast('백업 파일을 만드는 데 실패했어.')}}
function dataToBlob(data){let match=/^data:(image\/(?:png|jpeg|webp));base64,([a-zA-Z0-9+/=]+)$/.exec(data);if(!match)throw new Error('invalid image data');let bytes=atob(match[2]);if(bytes.length>5*1024*1024)throw new Error('image too large');let arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);return new Blob([arr],{type:match[1]})}
function validateBackup(obj){if(!obj||obj.app!=='stamp-book'||obj.version!==1||!Array.isArray(obj.goals)||!Array.isArray(obj.images)||obj.goals.length>1000||obj.images.length>500)throw new Error('지원하지 않는 백업 파일');let imgs=obj.images.map(img=>{if(typeof img.id!=='string'||typeof img.name!=='string'||img.name.length>100||typeof img.data!=='string')throw new Error('invalid image');return {id:img.id,name:img.name,created:img.created||new Date().toISOString(),blob:dataToBlob(img.data)}});let ids=new Set(imgs.map(i=>i.id));if(ids.size!==imgs.length)throw new Error('duplicate image id');let gs=obj.goals.map(g=>{if(typeof g.id!=='string'||typeof g.name!=='string'||!['count','date'].includes(g.type)||!Number.isInteger(g.target)||g.target<1||g.target>365||!/^\d{4}-\d{2}-\d{2}$/.test(g.start)||!Array.isArray(g.entries)||g.entries.length>g.target||!g.stamp||!['emoji','image'].includes(g.stamp.type)||typeof g.stamp.value!=='string'||g.stamp.type==='image'&&!ids.has(g.stamp.value))throw new Error('invalid goal');if(g.entries.some(e=>!e||typeof e.id!=='string'||typeof e.day!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.day)))throw new Error('invalid entries');return {id:g.id,name:g.name.slice(0,60),type:g.type,target:g.target,start:g.start,dailyLimit:!!g.dailyLimit,stamp:g.stamp,entries:g.entries,created:g.created||new Date().toISOString()}});if(new Set(gs.map(g=>g.id)).size!==gs.length)throw new Error('duplicate goal id');return {imgs,gs}}
async function importBackup(file){if(file.size>40*1024*1024)throw new Error('파일이 너무 커');let data=JSON.parse(await file.text()),{imgs,gs}=validateBackup(data);return {imgs,gs}}
function importDialog(){dialog(`<h2>백업 가져오기</h2><div class="alert">주의: 가져오면 현재 달성표와 도장 이미지가 모두 백업 파일 내용으로 교체돼. 먼저 현재 기록을 내보내 두는 걸 권장해.</div><label class="label" for="backupFile" style="margin-top:20px">백업 파일 선택</label><input class="field" id="backupFile" type="file" accept=".json,application/json"><label class="checkRow" style="margin:14px 0"><input type="checkbox" id="confirmReplace"> 현재 데이터를 교체하는 것에 동의해.</label><div class="buttonRow" style="margin-top:20px"><button class="secondary" id="cancelModal">취소</button><button class="primary" id="doImport">가져오기</button></div>`);document.getElementById('cancelModal').onclick=closeDialog;document.getElementById('doImport').onclick=async()=>{let file=document.getElementById('backupFile').files[0];if(!file||!document.getElementById('confirmReplace').checked){toast('파일과 교체 동의를 확인해 줘.');return}let btn=document.getElementById('doImport');btn.disabled=true;btn.textContent='복원 중…';try{let {imgs,gs}=await importBackup(file);await new Promise((resolve,reject)=>{let tx=db.transaction([GOALS,IMAGES],'readwrite'),goalStore=tx.objectStore(GOALS),imgStore=tx.objectStore(IMAGES);goalStore.clear();imgStore.clear();for(let g of gs)goalStore.put(g);for(let img of imgs)imgStore.put(img);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});for(let url of imageURL.values())URL.revokeObjectURL(url);imageURL.clear();await refresh();closeDialog();setPage('home');toast('백업에서 기록을 복원했어!')}catch(e){console.error(e);toast('올바른 백업 파일인지 확인해 줘.');btn.disabled=false;btn.textContent='가져오기'}}}
app.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;try{if(b.dataset.nav){if(b.dataset.nav==='create')draft=null;setPage(b.dataset.nav);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.openGoal){setPage('detail',b.dataset.openGoal);return}if(b.hasAttribute('data-upload-open')){if(page==='create')restoreDraft();uploadDialog();return}if(b.dataset.selectStamp){if(!draft)return;restoreDraft();let [type,value]=b.dataset.selectStamp.split(':');draft.stamp={type,value:type==='emoji'?decodeURIComponent(value):value};document.getElementById('draftStampOptions').innerHTML=options(draft.stamp);return}if(b.dataset.addCount){await addCount(byId(b.dataset.addCount));return}if(b.dataset.undoCount){await undoCount(byId(b.dataset.undoCount));return}if(b.dataset.countStamp!==undefined){let g=byId(goalId),n=Number(b.dataset.countStamp);if(n===count(g))await addCount(g);else if(n===count(g)-1)await undoCount(g);return}if(b.dataset.dateStamp){await toggleDate(byId(goalId),b.dataset.dateStamp);return}if(b.dataset.edit){editDialog(byId(b.dataset.edit));return}if(b.dataset.deleteGoal){let g=byId(b.dataset.deleteGoal);ask('달성표 삭제',`'${g.name}' 달성표와 찍은 도장 ${g.entries.length}개를 삭제할까? 업로드한 도장 이미지는 보관함에 남아.`, '삭제하기',async()=>{await del(GOALS,g.id);await refresh();setPage('home');toast('달성표를 삭제했어.')});return}if(b.dataset.imageDelete){deleteImageDialog(b.dataset.imageDelete);return}if(b.hasAttribute('data-export')){await exportBackup();return}if(b.hasAttribute('data-import-open')){importDialog();return}}catch(err){console.error(err);toast('처리하는 중 문제가 생겼어. 다시 시도해 줘.')}});
app.addEventListener('change',e=>{if(!e.target.closest('#goalForm'))return;restoreDraft();if(e.target.name==='type'){draft.type=e.target.value;render()}else if(e.target.name==='period'){draft.custom=e.target.value==='custom';if(!draft.custom)draft.target=Number(e.target.value);render()}});
app.addEventListener('submit',async e=>{if(e.target.id!=='goalForm')return;e.preventDefault();restoreDraft();if(!draft.name.trim()){toast('목표 이름을 입력해 줘.');return}if(!Number.isInteger(draft.target)||draft.target<1||draft.target>365){toast('목표는 1~365 사이로 설정해 줘.');return}if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.start)){toast('시작일을 선택해 줘.');return}if(draft.type==='date'&&draft.start>localDate()){/* future starts allowed */}let g={id:uid(),created:new Date().toISOString(),name:draft.name.trim(),type:draft.type,target:draft.target,start:draft.start,dailyLimit:draft.type==='date'?true:draft.dailyLimit,stamp:{...draft.stamp},entries:[]};try{await put(GOALS,g);await refresh();draft=null;setPage('detail',g.id);toast('새 달성표를 만들었어!')}catch(err){console.error(err);toast('저장하지 못했어. 저장 공간을 확인해 줘.')}});
nav.addEventListener('click',e=>{let b=e.target.closest('[data-nav]');if(b)setPage(b.dataset.nav)});
modalRoot.addEventListener('click',e=>{if(e.target.classList.contains('modalShade'))closeDialog()});
(async()=>{try{db=await openDB();await refresh();render()}catch(e){console.error(e);app.innerHTML='<section class="paper"><h1>저장소를 열 수 없어</h1><p>일반 브라우저에서 열어 줘. 시크릿 모드나 일부 파일 미리보기에서는 IndexedDB가 제한될 수 있어.</p></section>'}})();
})();
</script>
</body>
</html>
